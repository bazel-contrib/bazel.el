name: Push
on: push

permissions:
  contents: write

jobs:
  test:
    name: Test and release
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        bazel:
          - '8.0.0'
          - '8.x'
          - '9.x'
          - ''  # use .bazelversion
    runs-on: ${{matrix.os}}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelrc: |
            common --announce_rc
            common --show_progress_rate_limit=10
            common --remote_download_minimal
            common --lockfile_mode=${{case(matrix.bazel == '', 'error', 'off')}}
            build --verbose_failures
            build --experimental_convenience_symlinks=ignore
            build --show_result=0
            build --nostamp
            build --experimental_repository_cache_hardlinks
            build --toolchain_resolution_debug=//:bazel
            test --test_output=errors
            run --noomit_run_args
          disk-cache: ${{matrix.bazel || 'default'}}
          repository-cache: true
      - name: Run Bazel tests
        env:
          USE_BAZEL_VERSION: ${{matrix.bazel}}
        shell: bash
        run: make check
      - name: Build release archive
        if: >
          matrix.os == 'ubuntu-latest' && matrix.bazel == '' &&
          github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        shell: bash
        run: |
          bazel build --compilation_mode=opt -- //dev:release.tar
          cp -- bazel-bin/dev/release.tar 'bazel-${{github.ref_name}}.tar'
      - name: Create release
        if: >
          matrix.os == 'ubuntu-latest' && matrix.bazel == '' &&
          github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v3
        with:
          files: bazel-${{github.ref_name}}.tar
          generate_release_notes: true
