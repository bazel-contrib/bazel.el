name: Release

on:
  push:
    tags: v*.*.*

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelrc: |
            common --config=ci
            build --compilation_mode=opt
          disk-cache: default
          repository-cache: true
      - name: Run tests and build release archive
        shell: bash
        run: |
          make check
          bazel build -- //dev:release.tar
          cp -- bazel-bin/dev/release.tar 'bazel-${{github.ref_name}}.tar'
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: bazel-${{github.ref_name}}.tar
          generate_release_notes: true
